<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextileERP - সম্পূর্ণ সিস্টেম</title>
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #f4f7f6; }
        
        /* Login Screen */
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: #1e293b; position: fixed; width: 100%; top: 0; left: 0; z-index: 2000; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 320px; text-align: center; }
        .login-card h2 { margin-bottom: 20px; color: #1e293b; font-size: 20px; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        .login-card button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .login-card button:hover { background: #1d4ed8; }
        .error-msg { color: #dc2626; font-size: 12px; margin-top: 10px; }

        /* Main Dashboard (Hidden by default) */
        #app-container { display: none; }
        .navbar { background: #1e293b; color: #fff; padding: 12px 15px; position: fixed; width: 100%; top: 0; z-index: 1000; }
        .navbar h2 { font-size: 16px; }
        .sidebar { width: 120px; background: #ffffff; height: 100vh; position: fixed; top: 0; left: 0; padding-top: 65px; border-right: 1px solid #e2e8f0; }
        .sidebar ul { list-style: none; padding: 8px; }
        .sidebar ul li { padding: 10px 6px; margin-bottom: 6px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; color: #475569; text-align: center; }
        .sidebar ul li:hover { background: #f1f5f9; color: #0f172a; }
        .sidebar ul li.logout-btn { color: #dc2626; }
        .sidebar ul li.logout-btn:hover { background: #fee2e2; }
        .main-content { margin-left: 125px; padding: 75px 12px 12px 12px; }
        .content-card { background: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #2563eb; }
    </style>
</head>
<body>

    <!-- ১. লগইন স্ক্রিন -->
    <div id="login-screen">
        <div class="login-card">
            <h2>টেক্সটাইল ইআরপি লগইন</h2>
            <input type="email" id="login-email" placeholder="আপনার ইমেইল দিন">
            <input type="password" id="login-password" placeholder="পাসওয়ার্ড দিন">
            <button onclick="handleLogin()">প্রবেশ করুন</button>
            <div id="error-display" class="error-msg"></div>
        </div>
    </div>

    <!-- ২. মূল ড্যাশবোর্ড সিস্টেম -->
    <div id="app-container">
        <div class="navbar">
            <h2>টেক্সটাইল ইআরপি</h2>
        </div>
        <div class="sidebar">
            <ul>
                <li onclick="switchTab('dashboard')">ড্যাশবোর্ড</li>
                <li onclick="switchTab('settings')">সেটিংস</li>
                <li onclick="switchTab('profile')">প্রোফাইল</li>
                <li class="logout-btn" onclick="handleLogout()">লগ-আউট</li>
            </ul>
        </div>
        <div class="main-content">
            <div class="content-card" id="content-area">
                <h1>ড্যাশবোর্ড ওভারভিউ</h1>
                <p>টেক্সটাইল ইআরপি সিস্টেমে আপনাকে স্বাগতম।</p>
            </div>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script>
        // আপনার দেওয়া সঠিক ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyAe8lrZK_1SfN5a5yHfHX8m-BfmejUuMy4",
            authDomain: "textile-erp-4b093.firebaseapp.com",
            projectId: "textile-erp-4b093",
            storageBucket: "textile-erp-4b093.firebasestorage.app",
            messagingSenderId: "671075800351",
            appId: "1:671075800351:web:f792985406339c57e4cc2a",
            measurementId: "G-76QW93WQC0"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ইউজার লগইন স্টেট চেক করা
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
            } else {
                document.getElementById('app-container').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
            }
        });

        // লগইন ফাংশন
        function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('error-display');

            if(!email || !password) {
                errorDiv.innerText = "দয়া করে ইমেইল এবং পাসওয়ার্ড দিন।";
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    errorDiv.innerText = "লগইন ব্যর্থ: " + error.message;
                });
        }

        // লগ-আউট ফাংশন
        function handleLogout() {
            auth.signOut().then(() => {
                document.getElementById('login-email').value = '';
                document.getElementById('login-password').value = '';
                document.getElementById('error-display').innerText = '';
            });
        }

        // ট্যাব পরিবর্তন ফাংশন
        function switchTab(tabName) {
            const contentArea = document.getElementById('content-area');
            if(tabName === 'dashboard') {
                contentArea.innerHTML = `<h1>ড্যাশবোর্ড ওভারভিউ</h1><p>টেক্সটাইল ইআরপি সিস্টেমে আপনাকে স্বাগতম।</p>`;
            } else if(tabName === 'settings') {
                contentArea.innerHTML = `<h1>সিস্টেম সেটিংস</h1><p>আপনার সিস্টেমের প্রয়োজনীয় সেটিংস এখানে পরিবর্তন করুন।</p>`;
            } else if(tabName === 'profile') {
                const currentUser = auth.currentUser;
                const userEmail = currentUser ? currentUser.email : "N/A";
                contentArea.innerHTML = `<h1>ইউজার প্রোফাইল</h1><p><strong>লগইন করা ইমেইল:</strong> ${userEmail}</p>`;
            }
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Service Worker Registered Successfully'));
  }
</script>
     }
    </script>
</body>
</html>
