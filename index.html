<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textile ERP - অ্যাপ</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #f4f7f6; color: #1e293b; }

        /* Login Screen */
        #login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1e293b; position: fixed; width: 100%; top: 0; left: 0; z-index: 2000; padding: 20px; }
        .login-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 320px; max-width: 100%; text-align: center; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .login-card button { width: 100%; padding: 12px; margin-bottom: 8px; border: none; border-radius: 6px; color: #ffffff; font-weight: 600; cursor: pointer; }
        #login-button { background: #2563eb; }
        #signup-button { background: #059669; }
        .error-msg { color: #dc2626; font-size: 12px; margin-top: 10px; min-height: 18px; }

        /* Dashboard */
        #app-container { display: none; }
        .navbar { background: #1e293b; color: #ffffff; padding: 12px 15px; position: fixed; width: 100%; top: 0; z-index: 1000; }
        .sidebar { width: 120px; background: #ffffff; height: 100vh; position: fixed; top: 0; left: 0; padding-top: 65px; border-right: 1px solid #e2e8f0; z-index: 900; }
        .sidebar ul { list-style: none; padding: 8px; }
        .sidebar ul li { padding: 10px 6px; margin-bottom: 6px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; color: #475569; text-align: center; }
        .sidebar ul li:hover { background: #f1f5f9; color: #0f172a; }
        .logout-btn { color: #dc2626; font-weight: bold; }
        .logout-btn:hover { background: #fee2e2 !important; }
        .main-content { margin-left: 125px; padding: 75px 12px 12px 12px; }
        .content-card { background: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #2563eb; }
    </style>
</head>

<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>টেক্সটাইল ইআরপি</h2>
            <input type="email" id="login-email" placeholder="ইমেইল দিন" autocomplete="email">
            <input type="password" id="login-password" placeholder="পাসওয়ার্ড দিন" autocomplete="current-password">
            <button id="login-button" onclick="handleLogin()">প্রবেশ করুন</button>
            <button id="signup-button" onclick="handleSignup()">নতুন অ্যাকাউন্ট খুলুন</button>
            <div id="error-display" class="error-msg"></div>
        </div>
    </div>

    <div id="app-container">
        <div class="navbar"><h2>টেক্সটাইল ইআরপি</h2></div>
        <div class="sidebar">
            <ul>
                <li onclick="switchTab('dashboard')">ড্যাশবোর্ড</li>
                <li onclick="switchTab('settings')">সেটিংস</li>
                <li onclick="switchTab('profile')">প্রোফাইল</li>
                <li class="logout-btn" onclick="handleLogout()">লগ-আউট</li>
            </ul>
        </div>
        <div class="main-content">
            <div class="content-card" id="content-area">
                <h1>ড্যাশবোর্ড ওভারভিউ</h1>
                <p>স্বাগতম টেক্সটাইল ইআরপি সিস্টেমে।</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAe8lrZK_1SfN5a5yHfHX8m-BfmejUuMy4",
            authDomain: "textile-erp-4b093.firebaseapp.com",
            projectId: "textile-erp-4b093",
            storageBucket: "textile-erp-4b093.firebasestorage.app",
            messagingSenderId: "671075800351",
            appId: "1:671075800351:web:f792985406339c57e4cc2a",
            measurementId: "G-76QW93WQC0"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
            document.getElementById("login-screen").style.display = user ? "none" : "flex";
            document.getElementById("app-container").style.display = user ? "block" : "none";
        });

        function handleLogin() {
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;
            auth.signInWithEmailAndPassword(email, password).catch(e => document.getElementById("error-display").innerText = e.message);
        }

        function handleSignup() {
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;
            auth.createUserWithEmailAndPassword(email, password)
                .then(() => alert("অ্যাকাউন্ট তৈরি হয়েছে!"))
                .catch(e => document.getElementById("error-display").innerText = e.message);
        }

        function handleLogout() {
            auth.signOut();
        }

        function switchTab(tab) {
            const content = document.getElementById("content-area");
            if(tab === 'profile') {
                content.innerHTML = `<h1>প্রোফাইল</h1><p>ইমেইল: ${auth.currentUser?.email}</p>`;
            } else {
                content.innerHTML = `<h1>${tab.toUpperCase()}</h1><p>এখানে কন্টেন্ট আছে...</p>`;
            }
        }
    </script>
</body>
</html>
